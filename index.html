<style>
:root{
  --bg:#f6f4ee; --card:#ffffff; --ink:#1f2a24; --muted:#6b756f; --line:#e6e2d8;
  --brand:#2f6b4f; --brand-2:#e8f1ec; --accent:#c9932b; --accent-2:#fbf3e2;
  --good:#2f8a57; --warn:#c77d12; --bad:#c2453a; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
  --r:16px; --fs:16px;
}
:root[data-theme="dark"]{
  --bg:#121614; --card:#1b211e; --ink:#eef2ef; --muted:#9aa49e; --line:#2a322e;
  --brand:#5cc08d; --brand-2:#1f2e27; --accent:#e0b04f; --accent-2:#2c2617;
  --good:#5cc08d; --warn:#e0a24f; --bad:#ef7a6f; --shadow:none;
}
:root[data-text="large"]{--fs:18.5px}
:root{--h1:#2f8a5f;--h2:#1f6f78;--pop1:#ffd27a;--pop2:#7be0b0}
:root[data-palette="berry"]{--brand:#a23b8f;--brand-2:#fbe8f4;--accent:#ff6f91;--accent-2:#ffeef3;--h1:#b8418f;--h2:#6a3fb5;--pop1:#ffd1e6;--pop2:#c7b5ff}
:root[data-palette="ocean"]{--brand:#1f6fb2;--brand-2:#e5f1fb;--accent:#ff9f43;--accent-2:#fff3e6;--h1:#2a86d1;--h2:#1b4f9c;--pop1:#ffe08a;--pop2:#8fd3ff}
:root[data-palette="sunset"]{--brand:#d9534f;--brand-2:#fdecea;--accent:#7c5cff;--accent-2:#efeaff;--h1:#ff7a59;--h2:#d63f6b;--pop1:#ffe08a;--pop2:#ffc2a8}
:root[data-theme="dark"][data-palette="berry"]{--brand:#e38bd0;--brand-2:#3a2235}
:root[data-theme="dark"][data-palette="ocean"]{--brand:#7cc0ff;--brand-2:#1d2b3a}
:root[data-theme="dark"][data-palette="sunset"]{--brand:#ff9b8a;--brand-2:#3a2422}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--fs)/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 0 8px}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hello{font-size:.86em;color:var(--muted)}
h1{font-size:1.35em;margin:0;letter-spacing:-.01em}
h2{font-size:1.05em;margin:0 0 10px}
.iconbtn{border:0;background:var(--card);box-shadow:var(--shadow);width:42px;height:42px;border-radius:12px;display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:22px;height:22px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin:0 0 12px;border:1px solid var(--line)}
:root:not([data-theme="dark"]) .card{border-color:transparent}
.hero{background:linear-gradient(135deg,var(--h1),var(--h2));color:#fff;border:0;position:relative;overflow:hidden}
.hero>*{position:relative;z-index:1}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;z-index:0;opacity:.35}
.hero:before{width:220px;height:220px;right:-60px;top:-70px;background:var(--pop1)}
.hero:after{width:150px;height:150px;right:70px;bottom:-80px;background:var(--pop2)}
:root[data-theme="dark"] .hero{filter:saturate(.9) brightness(.85)}
.kcard{border:0!important}
.kcard .kpi{font-size:1.6em}
.swatches{display:flex;gap:10px;margin:4px 0 14px}
.sw{flex:1;border:3px solid transparent;border-radius:14px;padding:10px 6px;cursor:pointer;color:#fff;font-weight:700;font-size:.82em;text-align:center}
.sw.on{border-color:var(--ink)}
.hero .label{opacity:.85;font-size:.9em}
.big{font-size:2.6em;font-weight:750;letter-spacing:-.02em;line-height:1.05;margin:4px 0 6px;font-variant-numeric:tabular-nums}
.hero .sub{opacity:.92}
.pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);border-radius:999px;padding:4px 10px;font-size:.85em;margin-top:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--muted)}
.small{font-size:.86em}
.tnum{font-variant-numeric:tabular-nums}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:650;cursor:pointer;background:var(--brand);color:#fff;min-height:46px}
.btn.secondary{background:var(--brand-2);color:var(--brand)}
.btn.ghost{background:transparent;color:var(--brand);padding:8px 10px;min-height:0}
.btn.danger{background:transparent;color:var(--bad)}
.btn.full{width:100%}
.btn:disabled{opacity:.5}
.hero .btn.secondary{background:rgba(255,255,255,.18);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.ico{width:38px;height:38px;border-radius:11px;background:var(--brand-2);display:grid;place-items:center;font-size:1.15em;flex:none}
.grow{flex:1;min-width:0}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{font-size:.75em;font-weight:650;border-radius:999px;padding:2px 8px;background:var(--accent-2);color:var(--warn);white-space:nowrap}
.tag.good{background:var(--brand-2);color:var(--good)}
.tag.bad{background:#fbe9e7;color:var(--bad)}
:root[data-theme="dark"] .tag.bad{background:#3a2220}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:99px}
nav.tabs button.on{color:var(--tc,var(--brand))}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 12px;cursor:pointer;min-height:40px}
.chip.on{background:var(--cc,var(--brand));border-color:var(--cc,var(--brand));color:#fff}
label.f{display:block;margin:0 0 12px}
label.f span{display:block;font-size:.86em;color:var(--muted);margin-bottom:5px}
input.in,select.in{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;min-height:46px}
input.in:focus,select.in:focus{outline:2px solid var(--brand);outline-offset:1px}
.money{font-size:1.9em;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding:0 4px}
nav.tabs button{border:0;background:none;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.72em;color:var(--muted);cursor:pointer}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--brand);font-weight:700}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(90px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:20px;border:0;background:var(--accent);color:#fff;font-size:30px;box-shadow:0 6px 20px rgba(0,0,0,.18);cursor:pointer;z-index:9}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .2s ease-out}
.sheet .grab{width:42px;height:5px;background:var(--line);border-radius:9px;margin:0 auto 12px}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.banner{background:var(--accent-2);color:var(--ink);border-radius:14px;padding:12px 14px;margin:0 0 12px;display:flex;gap:10px;align-items:center}
.banner b{color:var(--warn)}
.demo{background:var(--accent);color:#fff;text-align:center;font-size:.85em;padding:7px 12px;font-weight:600}
.demo a{color:#fff}
.empty{text-align:center;color:var(--muted);padding:18px 8px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--line);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{border:0;background:transparent;border-radius:10px;padding:8px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.toast{position:fixed;left:50%;bottom:calc(160px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:30;font-weight:600;font-size:.92em;animation:fade .2s}
.step-dots{display:flex;gap:6px;justify-content:center;margin:6px 0 14px}
.step-dots i{width:8px;height:8px;border-radius:9px;background:var(--line)}
.step-dots i.on{background:var(--brand);width:22px}
.calc{font-size:.9em;color:var(--muted)}
.calc .row{padding:5px 0;border-bottom:1px dashed var(--line)}
.calc .row:last-child{border:0;font-weight:700;color:var(--ink)}
.kpi{font-size:1.35em;font-weight:700;font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div id="demoBar"></div>
<header class="top"><div class="wrap">
  <div><div class="hello" id="hello"></div><h1 id="title">Home</h1></div>
  <button class="iconbtn" data-act="settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</div></header>
<main class="wrap" id="main"></main>
<button class="fab" data-act="addSpend" aria-label="Log spending" id="fab">+</button>
<nav class="tabs"><div class="wrap" id="tabs"></div></nav>
<div id="layer"></div>

<script>
"use strict";
const EDITION = "demo"; // build script sets "demo" for the public demo
const DEMO_LIMIT = 20;
const SHOP_URL = "https://ridhaprintstudio.etsy.com";
const KEY = EDITION === "demo" ? "payday_demo_v1" : "payday_app_v1";

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const num = v => { const n = parseFloat(String(v).replace(/[^0-9.\-]/g, "")); return isFinite(n) ? Math.round(n * 100) / 100 : 0; };
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
const lastDay = (y, m) => new Date(y, m + 1, 0).getDate();
function addMonths(s, n, anchorDay) {
  const d = parse(s); const day = anchorDay || d.getDate();
  const t = new Date(d.getFullYear(), d.getMonth() + n, 1);
  t.setDate(Math.min(day, lastDay(t.getFullYear(), t.getMonth())));
  return ymd(t);
}
function step(s, freq, dir = 1, anchor) {
  switch (freq) {
    case "weekly": return addDays(s, 7 * dir);
    case "biweekly": return addDays(s, 14 * dir);
    case "yearly": return addMonths(s, 12 * dir, anchor);
    case "quarterly": return addMonths(s, 3 * dir, anchor);
    case "semimonthly": {
      const d = parse(s);
      if (dir > 0) return d.getDate() < 15 ? ymd(new Date(d.getFullYear(), d.getMonth(), 15)) : ymd(new Date(d.getFullYear(), d.getMonth() + 1, 1));
      return d.getDate() > 15 ? ymd(new Date(d.getFullYear(), d.getMonth(), 15)) : d.getDate() > 1 ? ymd(new Date(d.getFullYear(), d.getMonth(), 1)) : ymd(new Date(d.getFullYear(), d.getMonth() - 1, 15));
    }
    default: return addMonths(s, dir, anchor);
  }
}
const FREQ = {weekly:"Weekly", biweekly:"Every 2 weeks", semimonthly:"1st & 15th", monthly:"Monthly", quarterly:"Every 3 months", yearly:"Yearly"};
const perMonth = (amt, f) => amt * ({weekly:52/12, biweekly:26/12, semimonthly:2, monthly:1, quarterly:1/3, yearly:1/12}[f] || 1);
const fmtDate = s => parse(s).toLocaleDateString(undefined, {month: "short", day: "numeric"});
const fmtDay = s => { const n = daysBetween(today(), s); return n === 0 ? "Today" : n === 1 ? "Tomorrow" : n === -1 ? "Yesterday" : parse(s).toLocaleDateString(undefined, {weekday: "short", month: "short", day: "numeric"}); };

const CATS = [
  ["groceries","🛒","Groceries","#22b573"],["gas","⛽","Gas","#ff9f43"],["food","🍔","Food out","#ff6b6b"],["shopping","🛍️","Shopping","#a66bff"],
  ["home","🏠","Home","#4dabf7"],["kids","🧸","Kids","#f5b700"],["health","💊","Health","#ff6fa8"],["fun","🎉","Fun","#20c997"],["gifts","🎁","Gifts","#e64980"],["other","✳️","Other","#868e96"]
];
const COLORS = ["#4dabf7","#ff6b6b","#a66bff","#ff9f43","#20c997","#f5b700","#ff6fa8","#22b573"];
const colorAt = i => COLORS[((i % COLORS.length) + COLORS.length) % COLORS.length];
const tint = (hex, a = .16) => hex + Math.round(a * 255).toString(16).padStart(2, "0");
const icoS = hex => `style="background:${tint(hex)}"`;
const TABC = {home: "", spend: "#ff6b6b", bills: "#4dabf7", goals: "#a66bff", debt: "#ff9f43"};
const kcard = (hex, inner, cls = "") => `<section class="card kcard ${cls}" style="background:${tint(hex, .14)}">${inner.replace(/class="kpi"/g, `class="kpi" style="color:${hex}"`)}</section>`;
const PALETTES = [["garden","Garden","#2f8a5f,#1f6f78"],["berry","Berry","#b8418f,#6a3fb5"],["ocean","Ocean","#2a86d1,#1b4f9c"],["sunset","Sunset","#ff7a59,#d63f6b"]];
const catOf = id => CATS.find(c => c[0] === id) || CATS[CATS.length - 1];

/* ---------- state ---------- */
function blank() {
  return { v: 1, setup: false, name: "", currency: "$", theme: "auto", text: "normal", palette: "garden",
    balance: 0, balanceTs: Date.now(), payFreq: "biweekly", nextPayday: addDays(today(), 7), payAmount: 0, buffer: 50,
    bills: [], tx: [], goals: [], debts: [], extraDebt: 50, pause: [], wins: 0 };
}
let S = load();
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) return Object.assign(blank(), JSON.parse(raw)); } catch (e) {}
  return EDITION === "demo" ? sample() : blank();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast("Couldn't save on this device"); } }

function sample() {
  const s = blank(); const t = today();
  Object.assign(s, { setup: true, name: "Sam", balance: 1240, balanceTs: Date.now() - 3 * 86400000, payFreq: "biweekly",
    nextPayday: addDays(t, 6), payAmount: 1850, buffer: 50 });
  s.bills = [
    {id: uid(), name: "Rent", amount: 1100, freq: "monthly", nextDue: addDays(t, 18), icon: "🏠"},
    {id: uid(), name: "Phone", amount: 65, freq: "monthly", nextDue: addDays(t, 3), icon: "📱"},
    {id: uid(), name: "Car insurance", amount: 128, freq: "monthly", nextDue: addDays(t, 5), icon: "🚗"},
    {id: uid(), name: "Streaming", amount: 15.49, freq: "monthly", nextDue: addDays(t, 9), icon: "📺"},
    {id: uid(), name: "Electric", amount: 82, freq: "monthly", nextDue: addDays(t, 12), icon: "💡"}
  ];
  const ago = d => Date.now() - d * 86400000;
  s.tx = [
    {id: uid(), ts: ago(2.5), kind: "spend", amount: 64.2, cat: "groceries", note: "Weekly shop"},
    {id: uid(), ts: ago(1.6), kind: "spend", amount: 38, cat: "gas", note: ""},
    {id: uid(), ts: ago(1.1), kind: "spend", amount: 12.5, cat: "food", note: "Lunch"},
    {id: uid(), ts: ago(0.2), kind: "spend", amount: 6.75, cat: "food", note: "Coffee"}
  ];
  s.goals = [
    {id: uid(), name: "Emergency fund", icon: "🛟", target: 1000, saved: 340, perPay: 40, funded: ""},
    {id: uid(), name: "Christmas gifts", icon: "🎄", target: 400, saved: 150, perPay: 50, funded: ""}
  ];
  s.debts = [
    {id: uid(), name: "Credit card", balance: 2400, apr: 24.9, min: 75},
    {id: uid(), name: "Car loan", balance: 8600, apr: 6.5, min: 260}
  ];
  return s;
}

/* ---------- money math ---------- */
const money = (n, sign) => { const neg = n < 0; const v = Math.abs(n).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}); return (neg ? "−" : sign && n > 0 ? "+" : "") + S.currency + v; };
const money0 = n => { const neg = n < 0; return (neg ? "−" : "") + S.currency + Math.round(Math.abs(n)).toLocaleString(); };
function currentBalance() {
  let b = S.balance;
  for (const t of S.tx) if (t.ts > S.balanceTs) b += t.kind === "income" || t.kind === "refund" ? t.amount : -t.amount;
  return Math.round(b * 100) / 100;
}
const prevPayday = () => step(S.nextPayday, S.payFreq, -1);
const cycleKey = () => S.nextPayday;
function billsBeforePayday() { return S.bills.filter(b => b.nextDue < S.nextPayday).sort((a, b) => a.nextDue.localeCompare(b.nextDue)); }
function goalsReserved() { return S.goals.filter(g => g.perPay > 0 && g.funded !== cycleKey() && g.saved < g.target).reduce((a, g) => a + Math.min(g.perPay, g.target - g.saved), 0); }
function safe(extra = 0) {
  const bal = currentBalance();
  const bills = billsBeforePayday().reduce((a, b) => a + b.amount, 0);
  const goals = goalsReserved();
  const s = bal - bills - goals - S.buffer - extra;
  const days = Math.max(1, daysBetween(today(), S.nextPayday));
  return { bal, bills, goals, buffer: S.buffer, safe: s, days, perDay: s / days };
}
function cycleSpend() {
  const start = parse(prevPayday()).getTime();
  return S.tx.filter(t => t.kind === "spend" && t.ts >= start);
}
const spendCount = () => S.tx.filter(t => t.kind === "spend").length;

/* ---------- UI chrome ---------- */
const TABS = [
  ["home","Home",'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>'],
  ["spend","Spending",'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><path d="M7 15h3"/>'],
  ["bills","Bills",'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>'],
  ["goals","Savings",'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>'],
  ["debt","Debt",'<path d="M4 19l5-6 4 3 7-9"/><path d="M15 7h5v5"/>']
];
let tab = "home";
function renderTabs() {
  $("#tabs").innerHTML = TABS.map(([id, label, path]) => `<button class="${tab === id ? "on" : ""}" data-tab="${id}" aria-label="${label}" ${TABC[id] ? `style="--tc:${TABC[id]}"` : ""}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${path}</svg>${label}</button>`).join("");
}
function applyTheme() {

/* ---------- Debt ---------- */
function simulate(order) {
  let debts = S.debts.map(d => ({...d})); let month = 0, interest = 0; const extra = S.extraDebt || 0;
  if (!debts.length) return null;
  while (debts.some(d => d.balance > 0.005) && month < 600) {
    month++;
    debts.forEach(d => { if (d.balance > 0) { const i = d.balance * d.apr / 1200; interest += i; d.balance += i; } });
    let pool = extra;
    debts.forEach(d => { if (d.balance > 0) { const p = Math.min(d.min, d.balance); d.balance -= p; } else pool += d.min; });
    const sorted = debts.filter(d => d.balance > 0).sort(order);
    for (const d of sorted) { if (pool <= 0) break; const p = Math.min(pool, d.balance); d.balance -= p; pool -= p; }
  }
  return { month, interest };
}
function viewDebt() {
  const total = S.debts.reduce((a, d) => a + d.balance, 0);
  let out = kcard("#f08c00", `<div class="small muted">Total debt</div><div class="kpi">${money0(total)}</div>`);
  out += `<section class="card"><div class="row"><h2>Your debts</h2><button class="btn ghost" data-act="editDebt">+ Add</button></div>`;
  out += S.debts.length ? `<ul class="list">${S.debts.map((d, di) => `<li data-act="editDebt" data-id="${d.id}" style="cursor:pointer"><div class="ico" ${icoS(colorAt(di + 3))}>💳</div><div class="grow"><div class="ellip">${esc(d.name)}</div><div class="small muted">${d.apr}% APR · min ${money0(d.min)}/mo</div></div><div class="amt">${money0(d.balance)}</div></li>`).join("")}</ul>` : `<div class="empty">Add a card or loan to see your debt-free date.</div>`;
  out += `</section>`;
  if (S.debts.length) {
    const snow = simulate((a, b) => a.balance - b.balance), ava = simulate((a, b) => b.apr - a.apr);
    const date = m => { const d = new Date(); d.setMonth(d.getMonth() + m); return d.toLocaleDateString(undefined, {month: "short", year: "numeric"}); };
    const better = ava.interest < snow.interest - 1 ? "ava" : snow.month < ava.month ? "snow" : snow.month === ava.month && Math.abs(snow.interest - ava.interest) < 1 ? "same" : "snow";
    out += `<section class="card"><h2>Snowball vs Avalanche</h2>
      <label class="f"><span>Extra I can add each month</span><input class="in" inputmode="decimal" data-field="extraDebt" value="${S.extraDebt}"></label>
      <div class="grid2">
        <div class="card" style="margin:0;background:${tint("#4dabf7", .14)}"><div class="small muted">❄️ Snowball<br>smallest first</div><div class="kpi">${snow.month >= 600 ? "Never" : date(snow.month)}</div><div class="small muted">Interest ${money0(snow.interest)}</div>${better === "snow" ? '<span class="tag good">Quick wins</span>' : ""}</div>
        <div class="card" style="margin:0;background:${tint("#ff9f43", .14)}"><div class="small muted">🏔️ Avalanche<br>highest rate first</div><div class="kpi">${ava.month >= 600 ? "Never" : date(ava.month)}</div><div class="small muted">Interest ${money0(ava.interest)}</div>${better === "ava" ? `<span class="tag good">Saves ${money0(snow.interest - ava.interest)}</span>` : ""}</div>
      </div>
      ${better === "same" ? '<p class="small"><b>Both give the same result</b> with your debts — pick the one that keeps you motivated.</p>' : ""}<p class="small muted">Tip: every extra ${S.currency}25 a month moves your debt-free date closer. Try changing the number above.</p></section>`;
  }
  return out;
}

    <div class="chips" style="margin-bottom:12px" id="goalIcons">${icons.map(i => `<button class="chip ${i === g.icon ? "on" : ""}" data-icon="${i}">${i}</button>`).join("")}</div>
    <label class="f"><span>Goal name</span><input class="in" name="name" value="${esc(g.name)}" placeholder="e.g. Emergency fund"></label>
    <div class="grid2"><label class="f"><span>Target</span><input class="in" name="target" inputmode="decimal" value="${g.target}"></label>
    <label class="f"><span>Saved so far</span><input class="in" name="saved" inputmode="decimal" value="${g.saved}"></label></div>
    <label class="f"><span>Set aside each paycheck</span><input class="in" name="perPay" inputmode="decimal" value="${g.perPay}"></label>
    <button class="btn full" data-act="saveGoal" data-id="${id || ""}">Save</button>${id ? `<button class="btn danger full" data-act="delGoal" data-id="${id}">Delete goal</button>` : ""}`);
}
function openDebt(id) {
  const d = S.debts.find(x => x.id === id) || {name: "", balance: "", apr: "", min: ""};
  sheet(`<h2>${id ? "Edit debt" : "Add a debt"}</h2>
    <label class="f"><span>Name</span><input class="in" name="name" value="${esc(d.name)}" placeholder="e.g. Visa"></label>
    <div class="grid2"><label class="f"><span>Balance</span><input class="in" name="balance" inputmode="decimal" value="${d.balance}"></label>
    <label class="f"><span>Interest rate (APR %)</span><input class="in" name="apr" inputmode="decimal" value="${d.apr}"></label></div>
    <label class="f"><span>Minimum payment / month</span><input class="in" name="min" inputmode="decimal" value="${d.min}"></label>
    <button class="btn full" data-act="saveDebt" data-id="${id || ""}">Save</button>${id ? `<button class="btn danger full" data-act="delDebt" data-id="${id}">Delete</button>` : ""}`);
}
function openSettings() {
  sheet(`<h2>Settings</h2>
    <label class="f"><span>Your first name</span><input class="in" name="name" value="${esc(S.name)}"></label>
    <div class="grid2"><label class="f"><span>Paycheck amount</span><input class="in" name="payAmount" inputmode="decimal" value="${S.payAmount}"></label>
    <label class="f"><span>Next payday</span><input class="in" type="date" name="nextPayday" value="${S.nextPayday}"></label></div>
    <label class="f"><span>I get paid</span><select class="in" name="payFreq">${["weekly","biweekly","semimonthly","monthly"].map(k => `<option value="${k}" ${k === S.payFreq ? "selected" : ""}>${FREQ[k]}</option>`).join("")}</select></label>
    <div class="grid2"><label class="f"><span>Safety cushion</span><input class="in" name="buffer" inputmode="decimal" value="${S.buffer}"></label>
    <label class="f"><span>Currency symbol</span><input class="in" name="currency" value="${esc(S.currency)}" maxlength="4"></label></div>
    <label class="f"><span>Colors</span></label><div class="swatches" id="palPick">${PALETTES.map(([k, n, g]) => `<button class="sw ${k === (S.palette || "garden") ? "on" : ""}" data-pal="${k}" style="background:linear-gradient(135deg,${g})">${n}</button>`).join("")}</div>
    <div class="grid2"><label class="f"><span>Theme</span><select class="in" name="theme">${[["auto","Match phone"],["light","Light"],["dark","Dark"]].map(([k, v]) => `<option value="${k}" ${k === S.theme ? "selected" : ""}>${v}</option>`).join("")}</select></label>
    <label class="f"><span>Text size</span><select class="in" name="text"><option value="normal">Normal</option><option value="large" ${S.text === "large" ? "selected" : ""}>Large</option></select></label></div>
    <button class="btn full" data-act="saveSettings">Save settings</button>
    <hr style="border:0;border-top:1px solid var(--line);margin:18px 0">
    <h2>Install on your phone</h2>
    <p class="small muted" style="margin-top:0"><b>iPhone:</b> open in Safari → Share button → <i>Add to Home Screen</i>.<br><b>Android:</b> Chrome menu ⋮ → <i>Add to Home screen</i> / <i>Install app</i>.<br>It then opens like an app and works offline.</p>
    <h2>Backup</h2>
    <p class="small muted" style="margin-top:0">Your data stays only on this device. Save a backup file now and then, or use it to move to a new phone.</p>
    <div class="grid2"><button class="btn secondary" data-act="export">Save backup</button><button class="btn secondary" data-act="import">Restore backup</button></div>
    <input type="file" id="importFile" accept="application/json,.json" class="sr">
    <button class="btn danger full" data-act="reset" style="margin-top:12px">Erase everything</button>
    <p class="small muted" style="text-align:center">Payday Budget App · made by RidhaPrintStudio</p>`);
}

/* ---------- setup wizard ---------- */
let setupStep = 0; let draft = {};
function openSetup() {
  const steps = [
    () => `<div style="text-align:center;font-size:2.4em">🌿</div><h2 style="text-align:center;font-size:1.3em">Welcome! Let's find your<br>Safe to Spend number.</h2><p class="muted" style="text-align:center">3 quick questions. No bank login, no account. Everything stays on this device.</p>
      <label class="f"><span>Your first name (optional)</span><input class="in" name="name" value="${esc(draft.name || "")}"></label>`,
    () => `<h2>What's in your checking account right now?</h2><p class="muted small" style="margin-top:0">Open your bank app and type the balance. Close enough is fine.</p><input class="in money" name="balance" inputmode="decimal" placeholder="${S.currency}0.00" value="${draft.balance ?? ""}">`,
    () => `<h2>When do you get paid next?</h2>
      <label class="f"><span>Next payday</span><input class="in" type="date" name="nextPayday" value="${draft.nextPayday || addDays(today(), 7)}"></label>
      <label class="f"><span>How often</span><select class="in" name="payFreq">${["weekly","biweekly","semimonthly","monthly"].map(k => `<option value="${k}" ${k === (draft.payFreq || "biweekly") ? "selected" : ""}>${FREQ[k]}</option>`).join("")}</select></label>
      <label class="f"><span>Usual paycheck amount</span><input class="in" name="payAmount" inputmode="decimal" placeholder="${S.currency}0" value="${draft.payAmount ?? ""}"></label>`,
    () => `<h2>Any bills before then?</h2><p class="muted small" style="margin-top:0">Add the big ones now (rent, phone, car). You can add more later.</p>
      <ul class="list">${(draft.bills || []).map(b => `<li><div class="ico">🧾</div><div class="grow">${esc(b.name)}<div class="small muted">${fmtDate(b.nextDue)}</div></div><div class="amt">${money(b.amount)}</div></li>`).join("")}</ul>
      <div class="grid2"><input class="in" name="bname" placeholder="Bill name"><input class="in" name="bamt" inputmode="decimal" placeholder="Amount"></div>
      <label class="f" style="margin-top:10px"><span>Due date</span><input class="in" type="date" name="bdue" value="${addDays(today(), 3)}"></label>
      <button class="btn secondary full" data-act="setupAddBill">+ Add this bill</button>`
  ];
  sheet(`<div class="step-dots">${steps.map((_, i) => `<i class="${i === setupStep ? "on" : ""}"></i>`).join("")}</div>${steps[setupStep]()}
    <div class="grid2" style="margin-top:16px">${setupStep ? `<button class="btn secondary" data-act="setupBack">Back</button>` : "<span></span>"}<button class="btn" data-act="setupNext">${setupStep === steps.length - 1 ? "See my number →" : "Next"}</button></div>`);
  $("#layer .sheet-bg").removeAttribute("data-close");
}
function grabSetup() { $("#layer").querySelectorAll("[name]").forEach(i => { if (!["bname","bamt","bdue"].includes(i.name)) draft[i.name] = i.value; }); }

/* ---------- actions ---------- */
const A = {
  confirmYes() { const f = pending; pending = null; close(); f && f(); },
  settings: openSettings, addSpend: () => openSpend(), fit: openFit, checkin: openCheckin, howcalc: openHowCalc, addIncome: openIncome,
  editBill: e => openBill(e.dataset.id), editGoal: e => openGoal(e.dataset.id), editDebt: e => openDebt(e.dataset.id),
  saveSpend() {
    const amount = num(val("amt")); if (amount <= 0) return toast("Enter an amount");
    S.tx.push({id: uid(), ts: Date.now(), kind: "spend", amount, cat: spendCat, note: val("note").trim()});
    save(); close(); render(); const s = safe(); toast(`Logged · ${money(Math.max(0, s.perDay))}/day left`);
  },
  saveIncome() {
    const amount = num(val("amt")); if (amount <= 0) return toast("Enter an amount");
    const k = $("#incKind .on").dataset.k;
    S.tx.push({id: uid(), ts: Date.now(), kind: k, amount, note: val("note").trim() || (k === "refund" ? "Refund" : "Extra income")});
    save(); close(); render(); toast("Added");
  },
  delTx(e) { ask("Delete this entry?", () => { S.tx = S.tx.filter(t => t.id !== e.dataset.id); save(); render(); }); },
  saveCheckin() { S.balance = num(val("bal")); S.balanceTs = Date.now(); save(); close(); render(); toast("Balance updated ✓"); },
  paid(e) {
    const b = S.bills.find(x => x.id === e.dataset.id); if (!b) return;
    S.tx.push({id: uid(), ts: Date.now(), kind: "bill", amount: b.amount, note: b.name});
    b.nextDue = step(b.nextDue, b.freq, 1, b.anchor); save(); render(); toast(`${b.name} paid ✓ next ${fmtDate(b.nextDue)}`);
  },
  saveBill(e) {
    const id = e.dataset.id; const name = val("name").trim(); const amount = num(val("amount"));
    if (!name || amount <= 0) return toast("Add a name and amount");
    const icon = $("#billIcons .on")?.dataset.icon || "🧾"; const nextDue = val("nextDue") || today(); const freq = val("freq");
    const anchor = parse(nextDue).getDate();
    if (id) Object.assign(S.bills.find(b => b.id === id), {name, amount, nextDue, freq, icon, anchor});
    else S.bills.push({id: uid(), name, amount, nextDue, freq, icon, anchor});
    save(); close(); render();
  },
  delBill(e) { ask("Delete this bill?", () => { S.bills = S.bills.filter(b => b.id !== e.dataset.id); save(); close(); render(); }); },
  saveGoal(e) {
    const id = e.dataset.id; const name = val("name").trim(); const target = num(val("target"));
    if (!name || target <= 0) return toast("Add a name and target");
    const o = {name, target, saved: num(val("saved")), perPay: num(val("perPay")), icon: $("#goalIcons .on")?.dataset.icon || "🐷"};
    if (id) Object.assign(S.goals.find(g => g.id === id), o); else S.goals.push({id: uid(), funded: "", ...o});
    save(); close(); render();
  },
  delGoal(e) { ask("Delete this goal?", () => { S.goals = S.goals.filter(g => g.id !== e.dataset.id); save(); close(); render(); }); },
  fund(e) {
    const g = S.goals.find(x => x.id === e.dataset.id); const amt = Math.min(g.perPay, g.target - g.saved);
    g.saved = Math.round((g.saved + amt) * 100) / 100; g.funded = cycleKey();
    S.tx.push({id: uid(), ts: Date.now(), kind: "save", amount: amt, note: "Saved · " + g.name});
    save(); render(); toast(g.saved >= g.target ? "Goal reached! 🎉" : "Nice — set aside ✓");
  },
  env(e) { const n = +e.dataset.n; const s = new Set(S.env || []); s.has(n) ? s.delete(n) : s.add(n); S.env = [...s]; save(); render(); },
  saveDebt(e) {
    const id = e.dataset.id; const name = val("name").trim(); const balance = num(val("balance"));
    if (!name || balance <= 0) return toast("Add a name and balance");
    const o = {name, balance, apr: num(val("apr")), min: Math.max(1, num(val("min")))};
    if (id) Object.assign(S.debts.find(d => d.id === id), o); else S.debts.push({id: uid(), ...o});
    save(); close(); render();
  },
  delDebt(e) { ask("Delete this debt?", () => { S.debts = S.debts.filter(d => d.id !== e.dataset.id); save(); close(); render(); }); },
  pauseIt() { const amount = num(val("amt")); if (amount <= 0) return toast("Enter an amount"); S.pause.push({id: uid(), ts: Date.now(), amount, name: val("note").trim()}); save(); close(); tab = "home"; render(); toast("Paused for 48 hours ⏸️"); },
  buyIt() { const amount = num(val("amt")); if (amount <= 0) return toast("Enter an amount"); const note = val("note").trim(); close(); spendCat = "shopping"; openSpend({amount, note}); },
  skipPause(e) { const p = S.pause.find(x => x.id === e.dataset.id); S.wins = Math.round(((S.wins || 0) + p.amount) * 100) / 100; S.pause = S.pause.filter(x => x !== p); save(); render(); toast(`Kept ${money(p.amount)} 🎉`); },
  buyPause(e) { const p = S.pause.find(x => x.id === e.dataset.id); S.pause = S.pause.filter(x => x !== p); save(); spendCat = "shopping"; openSpend({amount: p.amount, note: p.name}); },
  payday() {
    sheet(`<h2>💸 Payday</h2><p class="muted small" style="margin-top:0">How much landed in your account?</p><input class="in money" name="amt" inputmode="decimal" value="${S.payAmount || ""}"><button class="btn full" data-act="savePayday" style="margin-top:14px">Add paycheck</button>`);
  },
  savePayday() {
    const amount = num(val("amt")); if (amount > 0) S.tx.push({id: uid(), ts: Date.now(), kind: "income", amount, note: "Paycheck"});
    while (daysBetween(today(), S.nextPayday) <= 0) S.nextPayday = step(S.nextPayday, S.payFreq, 1);
    save(); close(); render(); toast("New pay period started 🌱");
  },
  saveSettings() {
    S.name = val("name").trim(); S.payAmount = num(val("payAmount")); S.nextPayday = val("nextPayday") || S.nextPayday; S.payFreq = val("payFreq");
    S.buffer = Math.max(0, num(val("buffer"))); S.currency = val("currency").trim() || "$"; S.theme = val("theme"); S.text = val("text"); S.palette = $("#palPick .on")?.dataset.pal || S.palette;
    save(); close(); render(); toast("Saved ✓");
  },
  export() {
    const blob = new Blob([JSON.stringify(S, null, 1)], {type: "application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `payday-backup-${today()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  },
  import() { $("#importFile").click(); },
  reset() { ask("Erase all your data on this device? This can't be undone.", () => { S = EDITION === "demo" ? sample() : blank(); setupStep = 0; draft = {}; save(); close(); render(); }, "Erase"); },
  setupNext() {
    grabSetup();
    if (setupStep === 1 && draft.balance === "") return toast("Enter your balance (a guess is OK)");
    if (setupStep < 3) { setupStep++; return openSetup(); }
    Object.assign(S, {name: (draft.name || "").trim(), balance: num(draft.balance), balanceTs: Date.now(), nextPayday: draft.nextPayday || addDays(today(), 7),
      payFreq: draft.payFreq || "biweekly", payAmount: num(draft.payAmount), setup: true});
    S.bills = (draft.bills || []).map(b => ({...b, id: uid(), freq: "monthly", icon: "🧾", anchor: parse(b.nextDue).getDate()}));
    save(); close(); tab = "home"; render(); toast("Here's your number 🌿");
  },
  setupBack() { grabSetup(); setupStep = Math.max(0, setupStep - 1); openSetup(); },
  setupAddBill() {
    grabSetup(); const name = val("bname").trim(); const amount = num(val("bamt"));
    if (!name || amount <= 0) return toast("Add a name and amount");
    (draft.bills = draft.bills || []).push({name, amount, nextDue: val("bdue") || today()}); openSetup();
  }
};

document.addEventListener("click", e => {
  const bg = e.target.closest("[data-close]"); if (bg && (e.target === bg || e.target.dataset.close)) return close();
  const tb = e.target.closest("[data-tab]"); if (tb) { tab = tb.dataset.tab; close(); render(); scrollTo(0, 0); return; }
  const q = e.target.closest("[data-quick]"); if (q) { $('#layer [name="amt"]').value = q.dataset.quick; return; }
  const c = e.target.closest("[data-cat]"); if (c) { spendCat = c.dataset.cat; c.parentElement.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x === c)); return; }
  const ic = e.target.closest("[data-icon]"); if (ic) { ic.parentElement.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x === ic)); return; }
  const pal = e.target.closest("[data-pal]"); if (pal) { pal.parentElement.querySelectorAll(".sw").forEach(x => x.classList.toggle("on", x === pal)); document.documentElement.dataset.palette = pal.dataset.pal; return; }
  const k = e.target.closest("#incKind [data-k]"); if (k) { k.parentElement.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === k)); return; }
  const a = e.target.closest("[data-act]"); if (a && A[a.dataset.act]) A[a.dataset.act](a);
});
document.addEventListener("change", e => {
  if (e.target.dataset.field === "extraDebt") { S.extraDebt = Math.max(0, num(e.target.value)); save(); render(); }
  if (e.target.id === "importFile" && e.target.files[0]) {
    e.target.files[0].text().then(t => { const d = JSON.parse(t); if (!d || !Array.isArray(d.tx)) throw 0; S = Object.assign(blank(), d); save(); close(); render(); toast("Backup restored ✓"); }).catch(() => toast("That file isn't a Payday backup"));
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("#layer .sheet-bg[data-close]")) close();
  if (e.key === "Enter" && e.target.matches("#layer input.money")) { const b = $("#layer .btn[data-act^='save'], #layer [data-act='setupNext']"); b && b.click(); }
});
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", applyTheme);
render();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
